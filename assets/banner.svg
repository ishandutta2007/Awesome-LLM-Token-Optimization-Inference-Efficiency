<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#0a0c10; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Particle / Glow Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-15px) translateX(10px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      .glow-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 250px 120px;
      }
      .glow-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite;
        transform-origin: 950px 300px;
      }
      .particle {
        animation: floatParticle 6s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 12, 8;
        animation: flowLine 25s linear infinite;
      }
      .pill-pulse {
        animation: badgePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Glowing Dynamic Ambience Orbs (Behind Foreground) -->
  <circle class="glow-orb-1" cx="220" cy="110" r="140" fill="#38bdf8" filter="url(#blur-glow)"/>
  <circle class="glow-orb-2" cx="980" cy="300" r="160" fill="#c084fc" filter="url(#blur-glow)"/>

  <!-- Dynamic Flow Rays -->
  <path class="stream-line" d="M -50,330 Q 350,220 600,290 T 1250,210" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.25"/>
  <path class="stream-line" d="M -50,120 Q 300,200 650,110 T 1250,160" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>

  <!-- Floating Sparkles -->
  <circle class="particle" cx="180" cy="80" r="3" fill="#38bdf8" opacity="0.7"/>
  <circle class="particle" cx="1020" cy="140" r="2.5" fill="#c084fc" opacity="0.6"/>
  <circle class="particle" cx="880" cy="90" r="3.5" fill="#818cf8" opacity="0.7"/>
  <circle class="particle" cx="280" cy="360" r="3" fill="#38bdf8" opacity="0.6"/>

  <!-- Top Category Tag -->
  <g transform="translate(600, 56)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" class="pill-pulse"/>
    <text text-anchor="middle" y="5" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED AWESOME LIST ⚡</text>
  </g>

  <!-- MAIN FOREGROUND TITLE -->
  <text x="600" y="132" text-anchor="middle" fill="#ffffff" font-size="37" font-weight="800" letter-spacing="-0.5">
    Awesome LLM Token Optimization
  </text>
  <text x="600" y="180" text-anchor="middle" fill="url(#primary-grad)" font-size="34" font-weight="800" letter-spacing="-0.5">
    &amp; High-Efficiency Inference Runtimes
  </text>

  <!-- SUBTITLE -->
  <text x="600" y="222" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="400">
    Prompt Compression • Speculative Decoding • Paged KV-Cache • Constrained Masking • Inference Serving
  </text>

  <!-- FEATURE CARDS ROW (Pills) -->
  <g transform="translate(140, 275)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="210" height="74" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2"/>
      <text x="24" y="32" fill="#38bdf8" font-size="18">📉</text>
      <text x="52" y="32" fill="#f8fafc" font-size="14" font-weight="700">Prompt Pruning</text>
      <text x="52" y="52" fill="#94a3b8" font-size="11">Up to 20x token reduction</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(236, 0)" filter="url(#card-shadow)">
      <rect width="210" height="74" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.2"/>
      <text x="24" y="32" fill="#818cf8" font-size="18">⚡</text>
      <text x="52" y="32" fill="#f8fafc" font-size="14" font-weight="700">Speculative Decode</text>
      <text x="52" y="52" fill="#94a3b8" font-size="11">3x–5x generation speedup</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(472, 0)" filter="url(#card-shadow)">
      <rect width="210" height="74" rx="12" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.2"/>
      <text x="24" y="32" fill="#c084fc" font-size="18">💾</text>
      <text x="52" y="32" fill="#f8fafc" font-size="14" font-weight="700">Paged KV-Cache</text>
      <text x="52" y="52" fill="#94a3b8" font-size="11">Disaggregated prefix reuse</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(708, 0)" filter="url(#card-shadow)">
      <rect width="210" height="74" rx="12" fill="url(#card-grad)" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.2"/>
      <text x="24" y="32" fill="#34d399" font-size="18">🚀</text>
      <text x="52" y="32" fill="#f8fafc" font-size="14" font-weight="700">GPU Runtimes</text>
      <text x="52" y="52" fill="#94a3b8" font-size="11">Continuous batching &amp; FP8</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#primary-grad)"/>
</svg>